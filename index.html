<style>

<script>

let D=null,doc=null,canW=true,err='',tab='rekap',grp='all',per=0,q='',sel='',amt='',start=null,ready=false;

// ==== ISI BAGIAN INI dengan konfigurasi dari Firebase (Project settings > Your apps > Web app) ====
const FIREBASE_CONFIG={apiKey:"AIzaSyCPqTOD0TA02qdbXTsM6tA6cQ9cGHGvmoU",authDomain:"iuran-mill.firebaseapp.com",projectId:"iuran-mill",appId:"1:572228650053:web:f27e334bf038be27138f2c"};

let fdb=null,auth=null,user=null,unsub=null;
function simpan(n,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$('#ft').innerHTML='<button class="chip" id="bk">Simpan cadangan (.json)</button><button class="chip" id="rs">Impor cadangan</button><input type="file" id="fl" accept=".json,application/json" hidden><button class="chip" id="lo">Keluar</button><span class="s">Data tersimpan online dan dipakai bersama. Simpan cadangan (.json) sesekali.</span>';
$('#rs').onclick=()=>$('#fl').click();

$('#fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.members))throw 0;if(D&&D.members.length&&!confirm('Data di perangkat ini akan diganti. Lanjut?'))return;save(o);toast('Data berhasil diimpor')}catch(_){toast('File tidak valid')}};r.readAsText(f);e.target.value=''};

if(FIREBASE_CONFIG.apiKey!=='ISI'){
 firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fdb=firebase.firestore();
 let synced=false;
 auth.onAuthStateChanged(u=>{user=u;tab='rekap';if(unsub){unsub();unsub=null}D=null;ready=false;
  unsub=fdb.collection('iuran').doc(u?'main':'publik').onSnapshot(s=>{D=s.exists?s.data():null;ready=true;if(u&&D&&!synced){synced=true;fdb.collection('iuran').doc('publik').set({members:D.members}).catch(()=>{})}render()},e=>{err=e.message||e.code||'';ready=true;render()});
  render()});
}else render();
const TBP=[['rekap','Rekap'],['login','Login Pengurus']];
const TB=[['rekap','Rekap'],['input','Input Iuran'],['kas','Pengeluaran & Saldo'],['agt','Anggota']];
function render(){
 $('#ft').style.display=user?'flex':'none';
 $('#tb').innerHTML=(user?TB:TBP).map(([k,n])=>'<button data-t="'+k+'" class="'+(tab==k?'on':'')+'">'+n+'</button>').join('');
 document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 const v=$('#v');
 if(!auth){v.innerHTML='<div class="empty">Konfigurasi Firebase belum diisi. Buka index.html dan isi FIREBASE_CONFIG.</div>';return}
 if(!user&&tab=='login'){v.innerHTML='<div class="f" style="margin:20px auto"><b>Masuk</b><label>Email<input id="le" type="email" autocomplete="username"></label><label>Password<input id="lp" type="password" autocomplete="current-password"></label><button class="btn" id="lb">Masuk</button></div>';const go=()=>auth.signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value).catch(()=>toast('Email atau password salah'));$('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key=='Enter')go()};return}
 if(!ready){v.innerHTML='<div class="empty">Memuat data…</div>';return}
 if(!D){if(!user){v.innerHTML='<div class="empty">Data rekap belum tersedia.'+(err?' ('+esc(err)+')':'')+'</div>';return}v.innerHTML='<div class="empty"><p>Belum ada data online. Impor data-awal.json (cukup sekali).</p><button class="btn" id="e1">Impor data awal (.json)</button> <button class="chip" id="e2">Mulai dari kosong</button></div>';$('#e1').onclick=()=>$('#fl').click();$('#e2').onclick=()=>save({members:[],log:[],exp:[]});return}
 if(!user)tab='rekap';({rekap,input,kas,agt})[tab]();
}
function rekap(){
 const all=D.members,mx=Math.max(14,...all.flatMap(m=>m.paid));
 const yr=[[0,14,'Okt 2025 – Des 2026']];if(mx>14)yr.push([15,26,'2027']);if(mx>26)yr.push([27,38,'2028']);
 per=Math.min(per,yr.length-1);const[a,b]=yr[per];
 const ms=all.filter(m=>(grp=='all'||m.g==grp)&&(m.nama+' '+m.blok).toLowerCase().includes(q));
 const act=all.filter(m=>!m.st),paidNow=act.filter(m=>m.paid.includes(CUR)),belum=act.filter(m=>!m.paid.includes(CUR));
 const total=all.reduce((s,m)=>s+m.paid.length,0)*FEE;
 let h='<div class="cards"><div class="card"><b>'+rp(total)+'</b><span>Total iuran tercatat</span></div>'+
 '<div class="card"><b>'+paidNow.length+' / '+act.length+'</b><span>Sudah bayar '+lab(CUR)+'</span></div>'+
 '<div class="card"><b>'+rp(paidNow.length*FEE)+'</b><span>Masuk '+lab(CUR)+'</span></div></div>';
 h+='<div class="bar"><input id="q" placeholder="Cari nama atau blok…" value="'+esc(q)+'">'+
 '<select id="per">'+yr.map((y,i)=>'<option value="'+i+'"'+(i==per?' selected':'')+'>'+y[2]+'</option>').join('')+'</select></div>';
 h+='<div class="chips" style="margin-bottom:10px">'+[['all','Semua']].concat(Object.entries(GN)).map(([k,n])=>'<button class="chip'+(grp==k?' on':'')+'" data-g="'+k+'">'+n+'</button>').join('')+'</div>';
 h+='<details><summary>Belum bayar '+lab(CUR)+' ('+belum.length+')</summary><p class="s">'+(belum.map(m=>esc(m.nama)+' ('+esc(m.blok)+')').join(', ')||'Semua sudah bayar')+'</p></details>';
 let th='<tr><th class="n">Nama</th><th>Blok</th>';
 for(let i=a;i<=b;i++)th+='<th'+(i==CUR?' class="cur"':'')+'>'+lab(i).replace(' 20',' ’')+'</th>';
 th+='<th>Jumlah</th></tr>';
 let tb='';
 ms.forEach(m=>{
  const mn=m.paid.length?Math.min(...m.paid):1e9;
  tb+='<tr><td class="n">'+esc(m.nama)+(m.st?'<span class="tg">'+esc(m.st)+'</span>':'')+'</td><td>'+esc(m.blok)+'</td>';
  for(let i=a;i<=b;i++){
   if(m.paid.includes(i))tb+='<td class="ok">10k</td>';
   else if(!m.st&&i>mn&&i<=CUR)tb+='<td class="no">–</td>';else tb+='<td></td>';
  }
  tb+='<td><b>'+rp(m.paid.length*FEE)+'</b></td></tr>';
 });
 let ft='<tr><td class="n">Jumlah bayar</td><td></td>',f2='<tr><td class="n">Total uang masuk</td><td></td>';
 for(let i=a;i<=b;i++){const c=ms.filter(m=>m.paid.includes(i)).length;ft+='<td>'+(c||'')+'</td>';f2+='<td>'+(c?(c*FEE/1000)+'k':'')+'</td>'}
 ft+='<td></td></tr>';f2+='<td>'+rp(ms.reduce((s,m)=>s+m.paid.length,0)*FEE)+'</td></tr>';
 h+='<div class="wrap"><table><thead>'+th+'</thead><tbody>'+(tb||'<tr><td colspan="30" class="empty">Tidak ada data</td></tr>')+'</tbody><tfoot>'+ft+f2+'</tfoot></table></div>';
 h+='<button class="btn dl" id="dl">⬇ Unduh Rekap (Excel)</button><p class="s">Hijau = sudah bayar · Merah = belum bayar (bulan yang terlewat). Jumlah bayar & total uang dihitung sesuai filter di atas.</p>';
 $('#v').innerHTML=h;
 const qi=$('#q');qi.oninput=()=>{q=qi.value.toLowerCase();const p=qi.selectionStart;rekap();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
 $('#per').onchange=e=>{per=+e.target.value;rekap()};
 document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{grp=x.dataset.g;rekap()});$('#dl').onclick=unduh;
}
function plan(m,n,s){const r=[];for(let i=s;r.length<n;i++)if(!m.paid.includes(i))r.push(i);return r}
function input(){
 const mem=D.members,m=mem.find(x=>x.id==sel);
 const mx=Math.max(CUR,...mem.flatMap(x=>x.paid));
 if(m&&start===null)start=m.paid.length?Math.max(...m.paid)+1:CUR;
 const n=Math.round(+amt/FEE),okAmt=amt!==''&&+amt>0&&+amt%FEE===0;
 let pv='Pilih nama dan isi total uang yang dibayar.',bad=false,months=[];
 if(m&&amt!==''){
  if(!okAmt){pv='Total harus kelipatan Rp 10.000 (contoh 50000 = 5 bulan).';bad=true}
  else{months=plan(m,n,start);pv='<b>'+rp(+amt)+' = '+n+' bulan</b><br>'+(n>1?lab(months[0])+' – '+lab(months[n-1]):lab(months[0]))}
 }
 let h='<div class="f"><label>Nama<input id="nm" list="dl" placeholder="Ketik / pilih nama…" value="'+(m?esc(m.nama+' ('+m.blok+')'):'')+'" '+(canW?'':'disabled')+'></label>'+
 '<datalist id="dl">'+mem.map(x=>'<option value="'+esc(x.nama+' ('+x.blok+')')+'">').join('')+'</datalist>'+
 '<label>Total uang dibayar (Rp)<input id="am" type="number" inputmode="numeric" step="10000" min="0" placeholder="contoh: 50000" value="'+esc(amt)+'" '+(canW?'':'disabled')+'></label>'+
 '<div class="chips">'+[1,3,6,12].map(k=>'<button class="chip" data-a="'+k*FEE+'">'+k+' bln · '+(k*10)+'k</button>').join('')+'</div>'+
 '<label>Mulai dari bulan<select id="st">'+Array.from({length:mx+25},(_,i)=>'<option value="'+i+'"'+(i===start?' selected':'')+'>'+lab(i)+'</option>').join('')+'</select></label>'+
 '<div class="pv'+(bad?' err':'')+'">'+pv+'</div>'+
 '<button class="btn" id="sv" '+(canW&&m&&okAmt?'':'disabled')+'>Simpan iuran</button>'+
 (canW?'':'<p class="s">Kamu hanya bisa melihat. Minta akses edit ke pemilik halaman untuk input iuran.</p>')+'</div>';
 h+='<details style="max-width:560px"><summary>+ Tambah anggota baru</summary><div class="f" style="margin-top:8px"><label>Nama<input id="nn"></label><label>Blok / kode<input id="nb" placeholder="contoh: C4"></label><label>Kelompok<select id="ng">'+Object.entries(GN).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></label><button class="btn" id="na" '+(canW?'':'disabled')+'>Tambah</button></div></details>';
 const lg=(D.log||[]).slice().reverse().slice(0,12);
 h+='<div class="log"><b>Riwayat input terakhir</b>'+(lg.map(l=>'<div><span>'+esc(l.nama)+' · '+rp(l.total)+'<br><span class="s">'+lab(l.months[0])+(l.months.length>1?' – '+lab(l.months[l.months.length-1]):'')+'</span></span>'+(canW?'<button class="lnk" data-u="'+l.t+'">Batalkan</button>':'')+'</div>').join('')||'<p class="s">Belum ada input.</p>')+'</div>';
 $('#v').innerHTML=h;
 const re=()=>{const p=document.activeElement.id;input();const e=$('#'+p);if(e){e.focus();if(e.setSelectionRange&&e.type!='number')try{e.setSelectionRange(e.value.length,e.value.length)}catch(_){}}};
 $('#nm').oninput=e=>{const f=mem.find(x=>x.nama+' ('+x.blok+')'==e.target.value);if(f){sel=f.id;start=null;re()}else if(sel){sel='';start=null}};
 $('#am').oninput=e=>{amt=e.target.value;re()};
 $('#st').onchange=e=>{start=+e.target.value;re()};
 document.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{amt=x.dataset.a;input()});
 $('#sv').onclick=()=>{
  const nd=structuredClone(D),t=nd.members.find(x=>x.id==sel),ps=plan(t,n,start);
  t.paid=[...t.paid,...ps].sort((x,y)=>x-y);
  nd.log=[...(nd.log||[]),{t:Date.now(),id:t.id,nama:t.nama,total:+amt,months:ps}];
  amt='';start=null;save(nd);toast('Tersimpan: '+t.nama+' '+ps.length+' bulan');
 };
 $('#na').onclick=()=>{
  const nama=$('#nn').value.trim(),blok=$('#nb').value.trim().toUpperCase();if(!nama){toast('Isi nama dulu');return}
  const nd=structuredClone(D),id='m'+Date.now().toString(36);
  nd.members.push({id,g:$('#ng').value,blok:blok||'-',nama,st:'',paid:[]});
  sel=id;start=null;save(nd);toast('Anggota ditambahkan');
 };
 document.querySelectorAll('[data-u]').forEach(x=>x.onclick=()=>{
  const nd=structuredClone(D),l=nd.log.find(z=>z.t==x.dataset.u);if(!l||!confirm('Batalkan input '+l.nama+' '+rp(l.total)+'?'))return;
  const t=nd.members.find(z=>z.id==l.id);if(t)t.paid=t.paid.filter(i=>!l.months.includes(i));
  nd.log=nd.log.filter(z=>z.t!=l.t);save(nd);
 });
}
const ex=()=>D.exp||[],tm=()=>D.members.reduce((s,m)=>s+m.paid.length,0)*FEE;
const mi=d=>{const[y,m]=d.split('-');return Math.max(0,(+y-2025)*12+(+m)-10)};
const kmasuk=()=>(D.log||[]).reduce((s,l)=>s+l.total,0);
const ti=t=>{const d=new Date(t);return Math.max(0,(d.getFullYear()-2025)*12+d.getMonth()-9)};
function sal(){
 const E=ex(),L=D.log||[],ids=[CUR,...E.map(e=>mi(e.tgl)),...L.map(l=>ti(l.t))],a=Math.min(...ids),b=Math.max(...ids),rows=[];let s=D.awal||0;
 for(let i=a;i<=b;i++){const m=L.filter(l=>ti(l.t)==i).reduce((x,l)=>x+l.total,0),k=E.filter(e=>mi(e.tgl)==i).reduce((x,e)=>x+e.total,0);s+=m-k;rows.push([lab(i),m,k,s])}
 return rows}
function lama(){const A=D.lama||[];return '<h3>Rekap saldo lama (dari Excel)</h3>'+(A.length?'<div class="wrap"><table><thead><tr><th>Bulan</th><th>Masuk</th><th>Keluar</th><th>Saldo akhir</th></tr></thead><tbody>'+A.map(r=>'<tr><td style="text-align:left">'+esc(r[0])+'</td><td>'+rp(r[1])+'</td><td>'+rp(r[2])+'</td><td><b>'+rp(r[3])+'</b></td></tr>').join('')+'</tbody></table></div>':'<p class="s">Belum ada. Impor rekap-saldo-lama.json.</p>')+'<button class="chip" id="il" style="margin:8px 0">Impor rekap saldo lama (.json)</button><input type="file" id="fl2" accept=".json" hidden>'}
function kas(){
 const E=ex(),aw=D.awal||0,rows=sal(),mk=kmasuk(),kl=E.reduce((s,e)=>s+e.total,0),sisa=rows.length?rows[rows.length-1][3]:aw;
 const td=new Date(now-now.getTimezoneOffset()*6e4).toISOString().slice(0,10),dis=canW?'':' disabled';
 let h='<div class="cards">'+[['Saldo awal',aw],['Total uang masuk (sejak pakai web)',mk],['Total uang keluar',kl]].map(([n,v])=>'<div class="card"><b>'+rp(v)+'</b><span>'+n+'</span></div>').join('')+'<div class="card"><b style="color:var(--'+(sisa<0?'rd':'ac')+')">'+rp(sisa)+'</b><span>Uang tersedia</span></div></div>';
 h+='<div class="f"><b>Input pengeluaran</b><label>Tanggal<input id="ed" type="date" value="'+td+'"'+dis+'></label><label>Item keperluan<input id="ei" placeholder="contoh: beli galon, konsumsi 17-an…"'+dis+'></label><label>Total uang keluar (Rp)<input id="et" type="number" inputmode="numeric" min="0" placeholder="contoh: 150000"'+dis+'></label><button class="btn" id="es"'+dis+'>Simpan pengeluaran</button></div>';
 h+='<button class="btn dl" id="dl">⬇ Unduh Rekap (Excel)</button><h3>Rincian pengeluaran</h3>';
 const L=E.slice().sort((a,b)=>a.tgl<b.tgl?1:-1);
 h+='<div class="wrap"><table><thead><tr><th>Tanggal</th><th>Item keperluan</th><th>Total</th><th></th></tr></thead><tbody>'+(L.map(e=>'<tr><td>'+e.tgl.split('-').reverse().join('/')+'</td><td style="text-align:left">'+esc(e.item)+'</td><td>'+rp(e.total)+'</td><td>'+(canW?'<button class="lnk" data-x="'+e.t+'">Hapus</button>':'')+'</td></tr>').join('')||'<tr><td colspan="4" class="empty">Belum ada pengeluaran</td></tr>')+'</tbody><tfoot><tr><td></td><td style="text-align:left">Total keluar</td><td>'+rp(kl)+'</td><td></td></tr></tfoot></table></div>';
 h+='<h3>Rekap per bulan</h3><div class="wrap"><table><thead><tr><th>Bulan</th><th>Masuk</th><th>Keluar</th><th>Saldo akhir</th></tr></thead><tbody>'+rows.map(r=>'<tr><td style="text-align:left">'+r[0]+'</td><td>'+rp(r[1])+'</td><td>'+(r[2]?rp(r[2]):'-')+'</td><td><b>'+rp(r[3])+'</b></td></tr>').join('')+'</tbody></table></div>';
 h+=lama()+'<p class="s">Uang masuk = total uang yang diinput di tab Input Iuran sejak web dipakai. Saldo awal mengikuti saldo akhir di rekap Excel lama.</p><div class="f"><label>Saldo awal (Rp)<input id="aw" type="number" value="'+aw+'"'+dis+'></label><button class="btn" id="sa"'+dis+'>Ubah saldo awal</button></div>';
 $('#v').innerHTML=h;$('#dl').onclick=unduh;$('#il').onclick=()=>$('#fl2').click();$('#fl2').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.lama))throw 0;const nd=structuredClone(D);nd.lama=o.lama;nd.awal=+o.awal||0;save(nd);toast('Rekap saldo lama diimpor')}catch(_){toast('File tidak valid')}};r.readAsText(f);e.target.value=''};
 $('#es').onclick=()=>{const it=$('#ei').value.trim(),tt=Math.round(+$('#et').value),tg=$('#ed').value;if(!it||!(tt>0)||!tg){toast('Lengkapi tanggal, item, dan total');return}const nd=structuredClone(D);nd.exp=[...(nd.exp||[]),{t:Date.now(),tgl:tg,item:it,total:tt}];save(nd);toast('Pengeluaran tersimpan')};
 $('#sa').onclick=()=>{const nd=structuredClone(D);nd.awal=Math.round(+$('#aw').value)||0;save(nd);toast('Saldo awal diubah')};
 document.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{const nd=structuredClone(D),e=nd.exp.find(z=>z.t==x.dataset.x);if(!e||!confirm('Hapus pengeluaran "'+e.item+'"?'))return;nd.exp=nd.exp.filter(z=>z!==e);save(nd)});
}
function agt(){
 const dis=canW?'':' disabled';
 const h='<p class="s">Ubah nama penghuni atau blok/rumah di sini. Perubahan tersimpan otomatis setelah selesai mengetik. Anggota baru ditambah lewat tab Input Iuran.</p><div class="wrap"><table><thead><tr><th>Nama penghuni</th><th>Blok / rumah</th><th>Kelompok</th><th>Status</th><th></th></tr></thead><tbody>'+D.members.map(m=>'<tr><td><input data-i="'+m.id+'" data-f="nama" value="'+esc(m.nama)+'"'+dis+'></td><td><input data-i="'+m.id+'" data-f="blok" value="'+esc(m.blok)+'"'+dis+'></td><td><select data-i="'+m.id+'" data-f="g"'+dis+'>'+Object.entries(GN).map(([k,v])=>'<option value="'+k+'"'+(m.g==k?' selected':'')+'>'+v+'</option>').join('')+'</select></td><td><input data-i="'+m.id+'" data-f="st" placeholder="aktif" value="'+esc(m.st)+'"'+dis+'></td><td>'+(canW?'<button class="lnk" data-d="'+m.id+'">Hapus</button>':'')+'</td></tr>').join('')+'</tbody></table></div>';
 $('#v').innerHTML=h;
 document.querySelectorAll('[data-f]').forEach(x=>x.onchange=()=>{const v=x.value.trim();if(x.dataset.f=='nama'&&!v){toast('Nama tidak boleh kosong');render();return}const nd=structuredClone(D);nd.members.find(z=>z.id==x.dataset.i)[x.dataset.f]=v;save(nd);toast('Tersimpan')});
 document.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{const m=D.members.find(z=>z.id==x.dataset.d);if(!confirm('Hapus '+m.nama+'? Riwayat iuran orang ini ikut terhapus.'))return;const nd=structuredClone(D);nd.members=nd.members.filter(z=>z.id!=m.id);save(nd)});
}
async function unduh(){
 const mx=Math.max(14,...D.members.flatMap(m=>m.paid)),E=ex().slice().sort((a,b)=>a.tgl<b.tgl?-1:1),rows=sal(),aw=D.awal||0,kl=E.reduce((s,e)=>s+e.total,0);
 const H=['No','Nama','Blok','Kelompok','Status'];for(let i=0;i<=mx;i++)H.push(lab(i));H.push('Jumlah (Rp)');
 const R=[H,...D.members.map((m,k)=>[k+1,m.nama,m.blok,GN[m.g],m.st||'',...Array.from({length:mx+1},(_,i)=>m.paid.includes(i)?FEE:''),m.paid.length*FEE])];
 const P=[['Tanggal','Item keperluan','Total (Rp)'],...E.map(e=>[e.tgl,e.item,e.total]),['','TOTAL',kl]];
 const S=[['Bulan','Masuk','Keluar','Saldo akhir'],['Saldo awal','','',aw],...rows,[],['Total uang masuk',kmasuk()],['Total uang keluar',kl],['Uang tersedia',rows.length?rows[rows.length-1][3]:aw]];
 const d=new Date(now-now.getTimezoneOffset()*6e4).toISOString().slice(0,10),csv=a=>'\ufeff'+a.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 try{
  
  try{
   if(!window.XLSX)throw{code:'rejected_extension'};
   const wb=XLSX.utils.book_new();[['Rekap Iuran',R],...(user?[['Pengeluaran',P],['Saldo',S],['Rekap Lama',[['Bulan','Masuk','Keluar','Saldo akhir'],...(D.lama||[])]]]:[])].forEach(([n,a])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n));
   simpan('rekap-iuran-'+d+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}));
  }catch(e){
   if(e&&(e.code=='rejected_extension'||e.code=='extension_not_enabled')){simpan('rekap-iuran-'+d+'.csv',csv(R))}else throw e;
  }
 }catch(e){toast(e&&e.code=='declined'?'Unduhan dibatalkan':'Gagal mengunduh: '+((e&&e.message)||'error'))}
}
